name: beat-studio

# Only runs when Beat Studio changes. The Flutter app at the top level of the
# repository has no CI and is not affected by this workflow.
on:
  push:
    branches: [main]
    paths:
      - 'beat-studio/**'
      - '.github/workflows/beat-studio.yml'
  pull_request:
    paths:
      - 'beat-studio/**'
      - '.github/workflows/beat-studio.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: beat-studio

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the lowest version the project supports, 22 is current.
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: beat-studio/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npx vite build

      - name: Check the build produced an entry point
        run: test -f dist/index.html
