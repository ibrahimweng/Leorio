name: typeforge

# Only runs when Typeforge changes. The Flutter app at the top level of the
# repository has no CI and is not affected by this workflow.
on:
  push:
    branches: [main]
    paths:
      - 'typeforge/**'
      - '.github/workflows/typeforge.yml'
  pull_request:
    paths:
      - 'typeforge/**'
      - '.github/workflows/typeforge.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: typeforge

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the lowest version the project supports, 22 is current.
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typeforge/package-lock.json

      - run: npm ci

      # The export tests check their output against fontTools, the reference
      # implementation, rather than against this project's own reader.
      - name: Install fontTools
        run: pip install --quiet fonttools

      # Tests read a font from the system and skip when none is present, so
      # install one rather than let that coverage silently disappear.
      - name: Install a test font
        run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: typeforge/package-lock.json

      - run: npm ci

      - name: Install a test font
        run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - run: npx playwright install --with-deps chromium

      - run: npm run test:browser
